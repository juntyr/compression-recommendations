[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compression-requirement-safeguards"
version = "0.1.0a2"
dependencies = [
    "compression-recommendations==0.1.0a2",
    "compression-safeguards==1.0.0rc3",
]
requires-python = ">=3.11"
authors = [{ name = "Juniper Tyree", email = "juniper.tyree@helsinki.fi" }]
maintainers = [{ name = "Juniper Tyree", email = "juniper.tyree@helsinki.fi" }]
description = "Safeguard safety requirements for Safe Lossy Compression of scientific data"
readme = "README.md"
license = "MPL-2.0"
keywords = ["compression", "requirement", "safeguards", "weather", "climate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://compression-recommendations.readthedocs.io"
Repository = "https://github.com/juntyr/compression-recommendations.git"
Issues = "https://github.com/juntyr/compression-recommendations/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"compression_requirement_safeguards" = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "NPY", "T20", "SLOT", "TC", "PLC", "UP", "FURB"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
xfail_strict = true

[tool.hatch.build.targets.sdist]
include = ["/src", "/CITATION.cff", "/LICENSE", "/pyproject.toml", "/README.md"]

[tool.uv.sources]
compression-recommendations = { workspace = true }

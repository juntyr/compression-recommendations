[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compression-safeguards-recommendations"
version = "0.1.0"
dependencies = [
    "compression-recommendations==0.1.0",
    # FIXME: remove version pin in CI and in hatch metadata below
    "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@d401213b2e21c9d551ed58b04432edbc8458111b",
]
requires-python = ">=3.11"
authors = [{ name = "Juniper Tyree", email = "juniper.tyree@helsinki.fi" }]
maintainers = [{ name = "Juniper Tyree", email = "juniper.tyree@helsinki.fi" }]
description = "Recommendations for Safeguards for Safe Lossy Compression of weather and climate data"
readme = "README.md"
license = "MPL-2.0"
keywords = ["compression", "safeguards", "recommendations", "weather", "climate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://compression-requirements.readthedocs.io"
Repository = "https://github.com/juntyr/compression-requirements.git"
Issues = "https://github.com/juntyr/compression-requirements/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"compression_safeguards_recommendations" = ["py.typed"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "NPY", "T20", "SLOT", "TC", "PLC", "UP", "FURB"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
xfail_strict = true

[tool.hatch.build.targets.sdist]
include = ["/src", "/CITATION.cff", "/LICENSE", "/pyproject.toml", "/README.md"]

# FIXME: depend on next published safeguards version
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
compression-recommendations = { workspace = true }

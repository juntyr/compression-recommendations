name: Properdocs
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Replace symlinks with file copies
        run: find ./ -type l -exec sh -c 'for i in "$@"; do cp --preserve --remove-destination "$(readlink -f "$i")" "$i"; done' sh {} +

      - name: Install the docs dependencies
        run: |
          uv sync --no-install-workspace \
            --group docs \
            --resolution highest \
            --no-build

      - name: Build all packages
        run: uv build --all-packages

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@d401213b2e21c9d551ed58b04432edbc8458111b"
          uv pip install dist/*.whl \
            --resolution highest \
            --no-build

      - name: Build the docs
        run: uv run --no-sync properdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

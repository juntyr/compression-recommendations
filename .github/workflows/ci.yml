name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

env:
  CLICOLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check

  spelling:
    name: Spellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Spellcheck repo
        uses: crate-ci/typos@v1

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Check with ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --diff --check"

  citation:
    name: Citation Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@v5

      - name: Validate .zenodo.json
        uses: vsoch/zenodo-validator@00643f085e550b329ab56bc79da510ba18b2d547

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Replace symlinks with file copies
        run: find ./ -type l -exec sh -c 'for i in "$@"; do cp --preserve --remove-destination "$(readlink -f "$i")" "$i"; done' sh {} +

      - name: Build all packages
        run: uv build --all-packages

      - name: List the built dist files
        run: ls -lh dist/

      - name: Upload the package sdist and wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the test dependencies
        run: |
          uv sync --no-install-workspace \
            --group test \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@8de8d0e1b89c377e0263801bd05c6c2c413bbf02"
          uv pip install dist/*.whl \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Run tests
        run: uv run --no-sync pytest -v -W error

  typing:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the typecheck dependencies
        run: |
          uv sync --no-install-workspace \
            --group typecheck \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@8de8d0e1b89c377e0263801bd05c6c2c413bbf02"
          uv pip install dist/*.whl \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Typecheck compression-recommendations
        run: uv run --no-sync mypy -p compression_recommendations

      - name: Typecheck compression-safeguards-recommendations
        run: cd packages/compression-safeguards-recommendations && uv run --no-sync mypy -p compression_safeguards_recommendations

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          - python: "3.12"
            resolution: "lowest-direct"
          - python: "3.13"
            resolution: "lowest-direct"
          - python: "3.14"
            resolution: "lowest-direct"
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            fuzz/
            pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the fuzzing dependencies
        run: |
          uv sync --no-install-workspace \
            --group fuzz \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@8de8d0e1b89c377e0263801bd05c6c2c413bbf02"
          uv pip install dist/*.whl \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Restore the fuzzer corpus
        id: fuzzer-corpus-restore
        uses: actions/cache/restore@v6
        with:
          path: ./corpus
          key: fuzzer-corpus

      - name: Ensure the fuzzer corpus exists
        run: |
          mkdir -p ./corpus/safeguarded-checks

      - name: Print numpy info
        run: uv run --no-sync python -c "import numpy; numpy.show_config(); numpy.show_runtime()"

      - name: Run the fuzzers
        run: |
          uv run --no-sync fuzz/fuzz_safeguarded_checks.py ./corpus/safeguarded-checks -max_total_time=180

      - name: Delete the previous fuzzer corpus
        if: always() && steps.fuzzer-corpus-restore.outputs.cache-hit == 'true'
        run: gh cache delete fuzzer-corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the fuzzer corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ./corpus
          key: fuzzer-corpus

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the docs dependencies
        run: |
          uv sync --no-install-workspace \
            --group docs \
            --resolution highest \
            --no-build

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@8de8d0e1b89c377e0263801bd05c6c2c413bbf02"
          uv pip install dist/*.whl \
            --resolution highest \
            --no-build

      - name: Check docs build
        run: uv run --no-sync properdocs build

  doctest:
    name: Doctest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        resolution: ["highest", "lowest-direct"]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the doctest dependencies
        run: |
          uv sync --no-install-workspace \
            --group doctest \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@8de8d0e1b89c377e0263801bd05c6c2c413bbf02"
          uv pip install dist/*.whl \
            --resolution ${{ matrix.resolution }} \
            --no-build

      - name: Compile all docs
        run: |
          cp README.md docs/
          uv run --no-sync griffe2md src/compression_recommendations/ -o docs/compression_recommendations.md
          uv run --no-sync griffe2md packages/compression-safeguards-recommendations/src/compression_safeguards_recommendations/ -o docs/compression_safeguards_recommendations.md
          find docs -type f -name "*.md" | xargs sed -i -e 's/```py/```python/g'

      - name: Run doctests
        run: uv run --no-sync pytest -v -W error --codeblocks docs/

  pyodide-build:
    name: Build for Pyodide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with:
          repository: juntyr/compression-safeguards
          ref: 1.0.0rc1
          sparse-checkout: |
            tools/

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.2

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pyodide-build
        run: python -m pip install pyodide-build==0.33.0

      - name: Install the Pyodide build env
        run: pyodide xbuildenv install 0.29.2

      - name: Build compiled dependencies for Pyodide
        run: |
          pyodide build-recipes \
            --recipe-dir tools/ci/pyodide-recipes/packages \
            --install \
            numcodecs numpy numpy-quaddtype

      - name: Clean the Pyodide dist
        run: find dist/ -type f ! -name '*.whl' -delete

      - name: Upload the Pyodide wheels
        uses: actions/upload-artifact@v7
        with:
          name: pyodide-dist
          path: dist
          retention-days: 1

  pyodide-test:
    name: Test on Pyodide
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build, pyodide-build]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.2

      - name: Install pyodide-build
        run: python -m pip install pyodide-build

      - name: Install the Pyodide build env
        run: pyodide xbuildenv install 0.29.2

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download the pyodide-dist artifact
        uses: actions/download-artifact@v8
        with:
          name: pyodide-dist
          path: dist

      - name: Create the Pyodide venv
        run: |
          # Set up Pyodide venv
          pyodide venv --pip 26.0.1 .venv-pyodide
          source .venv-pyodide/bin/activate
          # Install pre-built packages (for dependencies)
          python -m pip install $(ls dist/*.whl)
          # Install test dependencies
          python -m pip install --group test
          # Install pre-built packages (to override)
          python -m pip install $(ls dist/*.whl)

      - name: Run tests
        run: |
          source .venv-pyodide/bin/activate
          python -m pytest -v -W error

  combine:
    name: Check recommendations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [build]
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the tools dependencies
        run: |
          uv sync --no-install-workspace \
            --group tools \
            --resolution highest \
            --no-build

      - name: Install the workspace packages
        run: |
          uv pip install "compression-safeguards @ git+https://github.com/juntyr/compression-safeguards.git@8de8d0e1b89c377e0263801bd05c6c2c413bbf02"
          uv pip install dist/*.whl \
            --resolution highest \
            --no-build

      - name: Update the combined recommendations
        run: uv run --no-sync python tools/compile.py

      - name: Check the recommendations are up-to-date
        run: git diff && git diff-index --quiet HEAD --

  publish:
    name: Publish to PyPi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event_name == 'release' }}
    needs:
      # require all jobs to succeed
      - check
      - spelling
      - fmt
      - build # includes the dist artifact
      - test
      - typing
      - docs
      - doctest
      - pyodide-test
      - combine
    steps:
      - name: Download the dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: List the built dist files
        run: ls -lh dist/

      - name: Publish the packages
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

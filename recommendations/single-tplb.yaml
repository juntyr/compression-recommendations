# Requirements for Trapping layer base height
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Trapping layer base height [m]
    filters:
    - kind: cf-short-name
      value: tplb
    - kind: grib-short-name
      value: tplb
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to range-relative
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # range-relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.01

# Requirements for Surface downward UV radiation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Surface downward UV radiation [J m**-2]
  - kind: any
    filters:
    - kind: cf-short-name
      value: uvb
    - kind: grib-short-name
      value: uvb
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Robin Hogan (ECMWF):
  # For all the accumulated radiative fluxes I am going for 1 W/m2 error in a
  # 1-hr mean, implying a 3600 J/m2 error in the accumulation. Note that you
  # can't easily convert this to a relative error, because accumulations can be
  # a year long, and you might want the same error in hourly average or daily
  # average flux for the final day as the beginning.
  #
  # Contact people:
  # - Robin Hogan (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 3600.0

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 J m^-2 <= uvb
  - kind: data-limits
    minimum: 0.0

# Requirements for Time-integrated northward turbulent surface stress
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-integrated northward turbulent surface stress [N m**-2 s]
    filters:
    - kind: cf-standard-name
      value: surface_downward_northward_stress
    - kind: cf-short-name
      value: nsss
    - kind: grib-short-name
      value: nsss
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 100.0

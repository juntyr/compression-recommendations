# Requirements for Time-integrated northward turbulent surface stress
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Time-integrated northward turbulent surface stress [N m**-2 s]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: surface_downward_northward_stress
    - kind: cf-short-name
      value: nsss
    - kind: grib-short-name
      value: nsss
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 100.0

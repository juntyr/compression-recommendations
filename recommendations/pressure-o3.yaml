# Requirements for Ozone mass mixing ratio
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Johannes Flemming (ECMWF)
# - Robin Hogan (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Ozone mass mixing ratio [kg kg**-1]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: mass_fraction_of_ozone_in_air
    - kind: cf-short-name
      value: o3
    - kind: grib-short-name
      value: o3
  # pressure-level variable
- kind: level-kind
  value: pressure

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

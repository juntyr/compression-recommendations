# Requirements for Eastward/Northward gravity wave surface stress
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)
# - Annelize van Niekerk (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Eastward gravity wave surface stress [N m**-2 s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: lgws
    - kind: grib-short-name
      value: lgws
    # Northward gravity wave surface stress [N m**-2 s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mgws
    - kind: grib-short-name
      value: mgws
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Sara Faghih-Naini (ECMWF) and Juniper Tyree (UH): Added a maximum pointwise
  # absolute error bound, since a mean error bound for a majority-zero field
  # can lose structure
  #
  # Sara Faghih-Naini (ECMWF) and Annelize van Niekerk (ECMWF): Tightened mean
  # absolute bound, and combined tighter max absolute and 1% max relative bound
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 10.0
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1.0

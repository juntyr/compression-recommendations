# Requirements for Standard deviation of sub-gridscale orography
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Standard deviation of sub-gridscale orography [m]
  - kind: any
    filters:
    - kind: cf-short-name
      value: sdor
    - kind: grib-short-name
      value: sdor
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1.0
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Juniper Tyree (UH): Initialised based on ERA5 data limits
- kind: all
  requirements:
    # 0 m <= sdor
  - kind: data-limits
    minimum: 0.0

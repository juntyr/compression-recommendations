# Requirements for Standard deviation of sub-gridscale orography
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Standard deviation of sub-gridscale orography
    filters:
    - kind: cf-short-name
      value: sdor
    - kind: grib-short-name
      value: sdor
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 6.158957694e-05 [m]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1.0
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 m <= sdor
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

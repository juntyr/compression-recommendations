# Requirements for Time-mean surface direct short-wave radiation flux
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean surface direct short-wave radiation flux
    filters:
    - kind: cf-short-name
      value: avg_sdirswrf
    - kind: grib-short-name
      value: avg_sdirswrf
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.01853990555 [W m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.1

# Requirements for Free convective velocity over the oceans
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Free convective velocity over the oceans
    filters:
    - kind: cf-short-name
      value: wstar
    - kind: grib-short-name
      value: wstar
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 4.31e-05 [m s**-1]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 m s^-1 <= wstar
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

# Requirements for Free convective velocity over the oceans
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Free convective velocity over the oceans [m s**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: wstar
    - kind: grib-short-name
      value: wstar
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # pointwise error bounds
  #
  # Contact people:
  # - Josh Kousal (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 m s^-1 <= wstar
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

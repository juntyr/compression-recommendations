# Requirements for Gravity wave dissipation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Gravity wave dissipation [J m**-2]
    filters:
    - kind: cf-short-name
      value: gwd
    - kind: grib-short-name
      value: gwd
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # @juntyr and @SF-N: Added a maximum pointwise absolute error bound, since
  # a mean error bound for a majority-zero field can lose structure
  #
  # Annelize Van Niekerk (ECMWF): Tightened mean absolute bound, and combined
  # tighter max absolute and 1% max relative bound
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  # - Annelize Van Niekerk (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # mean absolute AND (max absolute OR max relative) error
    requirements:
    - kind: mean-absolute-error-bound
      value: 10.0
    - kind: any
      requirements:
      - kind: max-pointwise-absolute-error-bound
        value: 100.0
        # relative error (0.01 = 1%)
      - kind: max-pointwise-relative-error-bound
        value: 0.01

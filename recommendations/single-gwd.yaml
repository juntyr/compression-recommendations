# Requirements for Gravity wave dissipation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Gravity wave dissipation [J m**-2]
    filters:
    - kind: cf-short-name
      value: gwd
    - kind: grib-short-name
      value: gwd
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # @juntyr and @SF-N: Added a maximum pointwise absolute error bound, since
  # a mean error bound for a majority-zero field can lose structure
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1000.0
    - kind: max-pointwise-absolute-error-bound
      value: 10000.0

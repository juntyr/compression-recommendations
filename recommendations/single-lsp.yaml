# Requirements for Large-scale precipitation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Large-scale precipitation [m]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_stratiform_precipitation_amount
    - kind: cf-short-name
      value: lsp
    - kind: grib-short-name
      value: lsp
  # single-level variable
- kind: level-kind
  value: single

requirements:

- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
- kind: all
  requirements:
  # valid value range: 0 m <= lsp
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

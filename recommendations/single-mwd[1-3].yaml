# Requirements for Mean wave direction of first-third swell partition
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Josh Kousal (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Mean wave direction of first swell partition [degrees]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwd1
    - kind: grib-short-name
      value: mwd1
    # Mean wave direction of second swell partition [degrees]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwd2
    - kind: grib-short-name
      value: mwd2
    # Mean wave direction of third swell partition [degrees]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwd3
    - kind: grib-short-name
      value: mwd3
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to range-relative
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 0.1
      # range-relative error (0.01 = 1%)
    - kind: mean-range-relative-error-bound
      value: 0.01

# Requirements for Mean wave direction of first-third swell partition
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Mean wave direction of first swell partition [degrees]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwd1
    - kind: grib-short-name
      value: mwd1
    # Mean wave direction of second swell partition [degrees]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwd2
    - kind: grib-short-name
      value: mwd2
    # Mean wave direction of third swell partition [degrees]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwd3
    - kind: grib-short-name
      value: mwd3
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to range-relative
  #
  # Contact people:
  # - Josh Kousal (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.1
  - kind: all
    # range-relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.01

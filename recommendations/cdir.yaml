# Requirements for Surface direct short-wave radiation, clear sky
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Surface direct short-wave radiation, clear sky
    filters:
    - kind: cf-short-name
      value: cdir
    - kind: grib-short-name
      value: cdir
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 194.84375 [J m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 3600.0

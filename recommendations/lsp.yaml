# Requirements for Large-scale precipitation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Large-scale precipitation
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_stratiform_precipitation_amount
    - kind: cf-short-name
      value: lsp
    - kind: grib-short-name
      value: lsp
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 7.76417437e-07 [m]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 1e-05

# Requirements for TOA incident short-wave (solar) radiation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # TOA incident short-wave (solar) radiation [J m**-2]
    filters:
    - kind: cf-short-name
      value: tisr
    - kind: grib-short-name
      value: tisr
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 3600.0
- kind: all
  requirements:
  # valid value range: 0 J m^-2 <= tisr
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

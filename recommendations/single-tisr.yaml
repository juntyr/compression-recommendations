# Requirements for TOA incident short-wave (solar) radiation
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Robin Hogan (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # TOA incident short-wave (solar) radiation [J m**-2]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tisr
    - kind: grib-short-name
      value: tisr
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  # 
  # Robin Hogan (ECMWF): See uvb for reasoning on 3600 J/m2
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 3600.0

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 J m^-2 <= tisr
  - kind: data-limits
    minimum: 0.0

# Requirements for Precipitation type
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Precipitation type
    filters:
    - kind: cf-short-name
      value: ptype
    - kind: grib-short-name
      value: ptype
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0001220703125 [Code table 4.201]
  requirements:
  - kind: all
    # absolute error
    #
    # conservative, provided by @juntyr
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.0
- kind: all
  # valid value range: 0 <= ptype <= 14
  # missing value: 255
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0
    maximum: 14
  - kind: missing-value
    value: 255

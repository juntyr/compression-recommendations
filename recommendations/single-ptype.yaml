# Requirements for Precipitation type
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Precipitation type [Code table 4.201]
  - kind: any
    filters:
    - kind: cf-short-name
      value: ptype
    - kind: grib-short-name
      value: ptype
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # pointwise error bounds
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # conservative, provided by @juntyr
  - kind: lossless
  # valid value range: 0 <= ptype <= 14
  # missing value: 255
  #
  # provided by @juntyr
- kind: all
  requirements:
  - kind: data-limits
    minimum: 0
    maximum: 14
  - kind: missing-value
    value: 255

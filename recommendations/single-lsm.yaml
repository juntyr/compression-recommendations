# Requirements for Land-sea mask
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Land-sea mask [dimensionless]
    filters:
    - kind: cf-standard-name
      value: land_binary_mask
    - kind: cf-short-name
      value: lsm
    - kind: grib-short-name
      value: lsm
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 5.960464477539063e-08 (0.01 = 1%)
  requirements:
    # conservative, provided by @juntyr
  - kind: lossless
- kind: all
  # It is important that threshold of 0.5 can still be used to decide whether
  # land or ocean (ECMWF)
  requirements:
  - kind: isovalue
    value: 0.5
- kind: all
  # valid value range: 0 % <= lsm <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

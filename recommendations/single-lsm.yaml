# Requirements for Land-sea mask
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Land-sea mask [dimensionless]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: land_binary_mask
    - kind: cf-short-name
      value: lsm
    - kind: grib-short-name
      value: lsm
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Kristian Mogensen (ECMWF)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
- kind: all
  requirements:
    # conservative, provided by @juntyr
  - kind: lossless
  # It is important that threshold of 0.5 can still be used to decide whether
  # land or ocean (ECMWF)
- kind: all
  requirements:
  - kind: isovalue
    value: 0.5

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 % <= lsm <= 100 %
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

# Requirements for Total column cloud liquid water
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Total column cloud liquid water [kg m**-2]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tclw
    - kind: grib-short-name
      value: tclw
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 kg m^-2 <= tclw
  - kind: data-limits
    minimum: 0.0

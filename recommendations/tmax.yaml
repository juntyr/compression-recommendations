# Requirements for Period corresponding to maximum individual wave height
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Period corresponding to maximum individual wave height
    filters:
    - kind: cf-short-name
      value: tmax
    - kind: grib-short-name
      value: tmax
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0002029534953 [s]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.01

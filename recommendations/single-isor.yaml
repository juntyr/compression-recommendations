# Requirements for Anisotropy of sub-gridscale orography
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Anisotropy of sub-gridscale orography
    filters:
    - kind: cf-short-name
      value: isor
    - kind: grib-short-name
      value: isor
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 5.845686957e-08 [Numeric]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 <= isor
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

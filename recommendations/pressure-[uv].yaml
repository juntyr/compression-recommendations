# Requirements for U/V components of wind
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # U component of wind [m s**-1]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: eastward_wind
    - kind: cf-short-name
      value: u
    - kind: grib-short-name
      value: u
    # V component of wind [m s**-1]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: northward_wind
    - kind: cf-short-name
      value: v
    - kind: grib-short-name
      value: v
  # pressure-level variable
- kind: level-kind
  value: pressure

requirements:

  # error bounds (all)
  #
  # Peter Bechtold (ECMWF) and Jean Bidlot (ECMWF) suggested to go lower than
  # 0.5m/s, e.g. 0.01m/s or even 0.001m/s for wind fields
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 0.001
    # global error bounds (all)
  - kind: all
    requirements: []

# Requirements for Instantaneous surface sensible heat net flux
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Instantaneous surface sensible heat net flux [W m**-2]
    filters:
    - kind: cf-short-name
      value: ishf
    - kind: grib-short-name
      value: ishf
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.1

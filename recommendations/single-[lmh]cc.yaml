# Requirements for Low/Medium/High cloud cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Low cloud cover [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: lcc
    - kind: grib-short-name
      value: lcc
    # Medium cloud cover [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mcc
    - kind: grib-short-name
      value: mcc
    # High cloud cover [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: hcc
    - kind: grib-short-name
      value: hcc
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # pointwise error bounds
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
  # valid value range: 0 % <= [lmh]cc <= 100 %
  #
  # provided by @juntyr
- kind: all
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

# Requirements for Low/Medium/High cloud cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Low cloud cover [dimensionless]
    filters:
    - kind: cf-short-name
      value: lcc
    - kind: grib-short-name
      value: lcc
  - kind: any
    # Medium cloud cover [dimensionless]
    filters:
    - kind: cf-short-name
      value: mcc
    - kind: grib-short-name
      value: mcc
  - kind: any
    # High cloud cover [dimensionless]
    filters:
    - kind: cf-short-name
      value: hcc
    - kind: grib-short-name
      value: hcc
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  # valid value range: 0 % <= [lmh]cc <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

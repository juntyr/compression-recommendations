# Requirements for Time-mean surface net short-wave radiation flux, clear sky
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean surface net short-wave radiation flux, clear sky [W m**-2]
    filters:
    - kind: cf-short-name
      value: avg_snswrfcs
    - kind: grib-short-name
      value: avg_snswrfcs
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.1
- kind: all
  requirements:
  # valid value range: 0 W m^-2 <= avg_snswrfcs
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

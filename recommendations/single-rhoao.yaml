# Requirements for Air density over the oceans
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Josh Kousal (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Air density over the oceans [kg m**-3]
  - kind: any
    filters:
    - kind: cf-short-name
      value: rhoao
    - kind: grib-short-name
      value: rhoao
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Sara Faghih-Naini (ECMWF) and Josh Kousal (ECMWF): Increased mean absolute
  # bound to 0.01 to permit lossy compression
  #
  # Sara Faghih-Naini (ECMWF): Switched from mean absolute to max absolute
  # bound, since variable variability is low, and removed mean relative
  # bound, since it was superfluous given the variable range offset
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

# Requirements for V component of wind
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # V component of wind
    filters:
    - kind: cf-standard-name
      value: northward_wind
    - kind: cf-short-name
      value: v
    - kind: grib-short-name
      value: v
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # Peter B. (ECMWF) and Jean (ECMWF) suggest to go lower, e.g. 0,01m/s or
  # even 0.001m/s for wind fields
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.00208951463 [m s**-1]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.5

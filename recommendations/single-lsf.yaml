# Requirements for Large-scale snowfall
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Large-scale snowfall
    filters:
    - kind: cf-short-name
      value: lsf
    - kind: grib-short-name
      value: lsf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 2.327105904e-07 [m of water equivalent]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
- kind: all
  requirements:
  # valid value range: 0 m <= lsf
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

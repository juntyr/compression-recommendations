# Requirements for Coefficient of drag with waves
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Josh Kousal (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Coefficient of drag with waves [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: cdww
    - kind: grib-short-name
      value: cdww
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Josh Kousal (ECMWF): Increased mean absolute bound to 1e-05 to permit lossy
  # compression
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-05
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

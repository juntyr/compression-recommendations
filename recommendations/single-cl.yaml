# Requirements for Lake cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Lake cover [dimensionless]
    filters:
    - kind: cf-short-name
      value: cl
    - kind: grib-short-name
      value: cl
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # provided by Margarita Choulga (ECMWF)
  #
  # Peter Dueben: changed from pointwise-relative to range-relative
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 5.960464477539063e-08 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.01
- kind: all
  # valid value range: 0 % <= cl <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

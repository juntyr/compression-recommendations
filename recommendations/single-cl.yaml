# Requirements for Lake cover
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Margarita Choulga (ECMWF)
# - Christoph Ruediger (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Lake cover [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: cl
    - kind: grib-short-name
      value: cl
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
  #
  # This variable is constant across ERA5 ensemble members
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-05
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Juniper Tyree (UH): Initialised based on ERA5 data limits
- kind: all
  requirements:
    # 0 % <= cl <= 100 %
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

# Requirements for Lake cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Lake cover
    filters:
    - kind: cf-short-name
      value: cl
    - kind: grib-short-name
      value: cl
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # provided by Margarita Choulga (ECMWF)
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 5.960464478e-08 [dimensionless]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  # valid value range: 0 % <= cl <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

# Requirements for Time-mean runoff rate water equivalent (surface plus subsurface)
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean runoff rate water equivalent (surface plus subsurface)
    filters:
    - kind: cf-short-name
      value: avg_rorwe
    - kind: grib-short-name
      value: avg_rorwe
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 7.54e-08 [kg m**-2 s**-1]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

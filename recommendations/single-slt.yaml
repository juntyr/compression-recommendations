# Requirements for Soil type
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Christoph Ruediger (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Soil type [Code table 4.213]
  - kind: any
    filters:
    - kind: cf-short-name
      value: slt
    - kind: grib-short-name
      value: slt
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements: []

  # lossless
  #
  # conservative, provided by @juntyr
  - kind: lossless

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 <= slt <= 11
  - kind: data-limits
    minimum: 0
    maximum: 11
    # missing value: 255
  - kind: missing-value
    value: 255

# Requirements for Soil type
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Soil type [Code table 4.213]
    filters:
    - kind: cf-short-name
      value: slt
    - kind: grib-short-name
      value: slt
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 5.960464477539063e-08 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    #
    # conservative, provided by @juntyr
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.0
- kind: all
  # valid value range: 0 <= slt <= 11
  # missing value: 255
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0
    maximum: 11
  - kind: missing-value
    value: 255

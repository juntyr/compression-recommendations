# Requirements for Time-mean snow evaporation rate water equivalent
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Christoph Ruediger (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Time-mean snow evaporation rate water equivalent [kg m**-2 s**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: avg_esrwe
    - kind: grib-short-name
      value: avg_esrwe
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Sara Faghih-Naini (ECMWF) and Juniper Tyree (UH): Added a maximum pointwise
  # absolute error bound, since a mean error bound for a majority-zero field
  # can lose structure
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 1e-06
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-07
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

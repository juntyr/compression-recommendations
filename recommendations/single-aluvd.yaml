# Requirements for UV visible albedo for diffuse radiation (climatological)
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Robin Hogan (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # UV visible albedo for diffuse radiation (climatological) [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: aluvd
    - kind: grib-short-name
      value: aluvd
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 0.01

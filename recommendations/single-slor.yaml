# Requirements for Slope of sub-gridscale orography
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Slope of sub-gridscale orography [Numeric]
  - kind: any
    filters:
    - kind: cf-short-name
      value: slor
    - kind: grib-short-name
      value: slor
  # single-level variable
- kind: level-kind
  value: single

requirements:

- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

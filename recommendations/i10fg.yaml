# Requirements for Instantaneous 10 metre wind gust
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Instantaneous 10 metre wind gust
    filters:
    - kind: cf-short-name
      value: i10fg
    - kind: grib-short-name
      value: i10fg
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0008022032562 [m s**-1]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.01

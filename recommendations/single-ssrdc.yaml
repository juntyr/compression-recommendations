# Requirements for Surface short-wave (solar) radiation downward clear-sky
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Surface short-wave (solar) radiation downward clear-sky [J m**-2]
  - kind: any
    filters:
    - kind: cf-short-name
      value: ssrdc
    - kind: grib-short-name
      value: ssrdc
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  # 
  # Robin Hogan (ECMWF): See uvb for reasoning on 3600 J/m2
  #
  # Contact people:
  # - Robin Hogan (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 3600.0

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 J m^-2 <= ssrdc
  - kind: data-limits
    minimum: 0.0

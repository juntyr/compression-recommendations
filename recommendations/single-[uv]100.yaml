# Requirements for 100 metre U/V wind components
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # 100 metre U wind component [m s**-1]
    filters:
    - kind: cf-short-name
      value: u100
    - kind: grib-short-name
      value: 100u
  - kind: any
    # 100 metre V wind component [m s**-1]
    filters:
    - kind: cf-short-name
      value: v100
    - kind: grib-short-name
      value: 100v
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  # 
  # Peter B. (ECMWF) and Jean (ECMWF) suggested to go low, e.g. 0.01m/s or
  # even 0.001m/s for wind fields
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.001

# Requirements for Mean wave period of first-third swell partition
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Mean wave period of first swell partition [s]
    filters:
    - kind: cf-short-name
      value: mwp1
    - kind: grib-short-name
      value: mwp1
  - kind: any
    # Mean wave period of second swell partition [s]
    filters:
    - kind: cf-short-name
      value: mwp2
    - kind: grib-short-name
      value: mwp2
  - kind: any
    # Mean wave period of third swell partition [s]
    filters:
    - kind: cf-short-name
      value: mwp3
    - kind: grib-short-name
      value: mwp3
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Josh Kousal (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 s <= mwp[1-3]
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

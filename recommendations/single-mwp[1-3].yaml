# Requirements for Mean wave period of first-third swell partition
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Mean wave period of first swell partition [s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwp1
    - kind: grib-short-name
      value: mwp1
    # Mean wave period of second swell partition [s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwp2
    - kind: grib-short-name
      value: mwp2
    # Mean wave period of third swell partition [s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mwp3
    - kind: grib-short-name
      value: mwp3
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Josh Kousal (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 s <= mwp[1-3]
    minimum: 0.0

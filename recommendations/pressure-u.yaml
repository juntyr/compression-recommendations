# Requirements for U component of wind
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # U component of wind [m s**-1]
    filters:
    - kind: cf-standard-name
      value: eastward_wind
    - kind: cf-short-name
      value: u
    - kind: grib-short-name
      value: u
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # Peter B. (ECMWF) and Jean (ECMWF) suggest to go lower, e.g. 0,01m/s or
  # even 0.001m/s for wind fields
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.5

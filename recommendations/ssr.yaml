# Requirements for Surface net short-wave (solar) radiation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Surface net short-wave (solar) radiation
    filters:
    - kind: cf-standard-name
      value: surface_net_downward_shortwave_flux
    - kind: cf-short-name
      value: ssr
    - kind: grib-short-name
      value: ssr
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 179.6835938 [J m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 3600.0

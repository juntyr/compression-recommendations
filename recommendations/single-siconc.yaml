# Requirements for Sea ice area fraction
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Sea ice area fraction [dimensionless]
    filters:
    - kind: cf-standard-name
      value: sea_ice_area_fraction
    - kind: cf-short-name
      value: siconc
    - kind: grib-short-name
      value: ci
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # Peter Dueben: changed from pointwise-relative to range-relative
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.01
    - kind: max-pointwise-range-relative-error-bound
      value: 0.05
- kind: all
  # valid value range: 0 % <= siconc <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

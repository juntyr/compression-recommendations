# Requirements for Sea ice area fraction
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Sea ice area fraction [dimensionless]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: sea_ice_area_fraction
    - kind: cf-short-name
      value: siconc
    - kind: grib-short-name
      value: ci
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # pointwise error bounds
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
    - kind: max-pointwise-relative-error-bound
      value: 0.05
  # valid value range: 0 % <= siconc <= 100 %
  #
  # provided by @juntyr
- kind: all
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

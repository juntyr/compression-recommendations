# Requirements for Temperature of snow layer
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Temperature of snow layer [K]
    filters:
    - kind: cf-standard-name
      value: temperature_in_surface_snow
    - kind: cf-short-name
      value: tsn
    - kind: grib-short-name
      value: tsn
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.05

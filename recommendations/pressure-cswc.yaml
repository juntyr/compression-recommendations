# Requirements for Specific snow water content
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Peter Bechtold (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Specific snow water content [kg kg**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: cswc
    - kind: grib-short-name
      value: cswc
  # pressure-level variable
- kind: level-kind
  value: pressure

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

  # value validity constraints (all)
  #
  # Juniper Tyree (UH): Initialised based on ERA5 data limits
- kind: all
  requirements:
    # 0 % <= cswc
  - kind: data-limits
    minimum: 0.0

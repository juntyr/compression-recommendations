# Requirements for Standard deviation of filtered subgrid orography (climatological)
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Standard deviation of filtered subgrid orography (climatological) [m]
  - kind: any
    filters:
    - kind: cf-short-name
      value: sdfor
    - kind: grib-short-name
      value: sdfor
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.05
    # global error bounds (all)
  - kind: all
    requirements:
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.05

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 m <= sdfor
  - kind: data-limits
    minimum: 0.0

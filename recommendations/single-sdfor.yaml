# Requirements for Standard deviation of filtered subgrid orography (climatological)
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Standard deviation of filtered subgrid orography (climatological)
    filters:
    - kind: cf-short-name
      value: sdfor
    - kind: grib-short-name
      value: sdfor
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 3.720775203e-05 [m]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.05
    - kind: max-pointwise-relative-error-bound
      value: 0.05
- kind: all
  requirements:
  # valid value range: 0 m <= sdfor
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

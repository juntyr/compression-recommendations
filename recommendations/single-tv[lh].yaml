# Requirements for Type of low/high vegetation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Type of low vegetation [Code table 4.234]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tvl
    - kind: grib-short-name
      value: tvl
    # Type of high vegetation [Code table 4.234]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tvh
    - kind: grib-short-name
      value: tvh
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # conservative, provided by @juntyr
  - kind: lossless

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 1 <= tv[lh] <= 20
    minimum: 0
    maximum: 20

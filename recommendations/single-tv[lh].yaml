# Requirements for Type of low/high vegetation
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Christoph Ruediger (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Type of low vegetation [Code table 4.234]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tvl
    - kind: grib-short-name
      value: tvl
    # Type of high vegetation [Code table 4.234]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tvh
    - kind: grib-short-name
      value: tvh
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements: []

  # lossless
  #
  # Christoph Ruediger (ECMWF): The vegetation type values are integers - there
  # shouldn't be an error associated with them.
- kind: lossless

  # value validity constraints (all)
  #
  # Juniper Tyree (UH): Initialised based on WMO Code Table 4.234
- kind: all
  requirements:
    # 1 <= tv[lh] <= 20
  - kind: data-limits
    minimum: 0
    maximum: 20

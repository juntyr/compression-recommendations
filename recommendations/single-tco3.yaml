# Requirements for Total column ozone
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Total column ozone
    filters:
    - kind: cf-standard-name
      value: atmosphere_mass_content_of_ozone
    - kind: cf-short-name
      value: tco3
    - kind: grib-short-name
      value: tco3
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 1.524707898e-07 [kg m**-2]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

# Requirements for Sea surface temperature
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Sea surface temperature [K]
    filters:
    - kind: cf-short-name
      value: sst
    - kind: grib-short-name
      value: sst
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Peter B. (ECMWF) recommends 0.01K for T fields for long integrations to
  # make budgets
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.01

# Requirements for Time-mean sub-surface runoff rate
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean sub-surface runoff rate [kg m**-2 s**-1]
    filters:
    - kind: cf-short-name
      value: avg_ssurfror
    - kind: grib-short-name
      value: avg_ssurfror
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-06
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 kg m^-2 s^-1 <= avg_ssurfror
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

# Requirements for Time-mean sub-surface runoff rate
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Time-mean sub-surface runoff rate [kg m**-2 s**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: avg_ssurfror
    - kind: grib-short-name
      value: avg_ssurfror
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # @juntyr and @SF-N: Added a maximum pointwise absolute error bound, since
  # a mean error bound for a majority-zero field can lose structure
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 1e-05
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-06
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 kg m^-2 s^-1 <= avg_ssurfror
  - kind: data-limits
    minimum: 0.0

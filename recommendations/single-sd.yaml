# Requirements for Snow depth
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Snow depth [m of water equivalent]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_surface_snow_amount
    - kind: cf-short-name
      value: sd
    - kind: grib-short-name
      value: sd
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-05
  - kind: all
    requirements:
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 m <= sd
  - kind: data-limits
    minimum: 0.0

# Requirements for Specific cloud liquid water content
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Specific cloud liquid water content [kg kg**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: clwc
    - kind: grib-short-name
      value: clwc
  # pressure-level variable
- kind: level-kind
  value: pressure

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 12 bits adds a maximum pointwise
  # range-relative error of 1 / (2^12 - 1) ⪆ 2.442e-04 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 % <= clwc
  - kind: data-limits
    minimum: 0.0

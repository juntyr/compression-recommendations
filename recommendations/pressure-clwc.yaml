# Requirements for Specific cloud liquid water content
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Specific cloud liquid water content
    filters:
    - kind: cf-short-name
      value: clwc
    - kind: grib-short-name
      value: clwc
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 7.31786713e-07 [kg kg**-1]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.01
- kind: all
  # value range: 0 % <= clwc
  #
  # provided by @juntyr
  requirements:
  - kind: global-minimum
    value: 0.0

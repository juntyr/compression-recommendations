# Requirements for Divergence
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Divergence [s**-1]
    filters:
    - kind: cf-standard-name
      value: divergence_of_wind
    - kind: cf-short-name
      value: d
    - kind: grib-short-name
      value: d
- kind: level-kind
  value: pressure
requirements:
- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.05

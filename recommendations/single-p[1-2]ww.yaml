# Requirements for Mean wave period based on first/second moment for wind waves
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Mean wave period based on first moment for wind waves [s]
    filters:
    - kind: cf-short-name
      value: p1ww
    - kind: grib-short-name
      value: p1ww
  - kind: any
    # Mean wave period based on second moment for wind waves [s]
    filters:
    - kind: cf-short-name
      value: p2ww
    - kind: grib-short-name
      value: p2ww
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Josh Kousal (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 s <= p[1-2]ww
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

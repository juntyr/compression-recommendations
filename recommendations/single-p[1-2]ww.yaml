# Requirements for Mean wave period based on first/second moment for wind waves
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Josh Kousal (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Mean wave period based on first moment for wind waves [s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: p1ww
    - kind: grib-short-name
      value: p1ww
    # Mean wave period based on second moment for wind waves [s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: p2ww
    - kind: grib-short-name
      value: p2ww
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 s <= p[1-2]ww
  - kind: data-limits
    minimum: 0.0

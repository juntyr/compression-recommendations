# Requirements for Surface net short-wave (solar) radiation, clear sky
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Surface net short-wave (solar) radiation, clear sky
    filters:
    - kind: cf-standard-name
      value: surface_net_downward_shortwave_flux_assuming_clear_sky
    - kind: cf-short-name
      value: ssrc
    - kind: grib-short-name
      value: ssrc
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 178.9921875 [J m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 3600.0
- kind: all
  requirements:
  # valid value range: 0 J m^-2 <= ssrc
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

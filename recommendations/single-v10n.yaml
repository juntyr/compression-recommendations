# Requirements for 10 metre v-component of neutral wind
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # 10 metre v-component of neutral wind
    filters:
    - kind: cf-short-name
      value: v10n
    - kind: grib-short-name
      value: v10n
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0009802172426 [m s**-1]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01

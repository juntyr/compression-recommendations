# Requirements for Time-integrated surface sensible heat net flux
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-integrated surface sensible heat net flux
    filters:
    - kind: cf-standard-name
      value: surface_upward_sensible_heat_flux
    - kind: cf-short-name
      value: sshf
    - kind: grib-short-name
      value: sshf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 203.8221436 [J m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1000.0

# Requirements for Time-integrated surface sensible heat net flux
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-integrated surface sensible heat net flux [J m**-2]
    filters:
    - kind: cf-standard-name
      value: surface_upward_sensible_heat_flux
    - kind: cf-short-name
      value: sshf
    - kind: grib-short-name
      value: sshf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1000.0

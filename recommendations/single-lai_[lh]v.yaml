# Requirements for Leaf area index, low/high vegetation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Leaf area index, low vegetation [m**2 m**-2]
  - kind: any
    filters:
    - kind: cf-short-name
      value: lai_lv
    - kind: grib-short-name
      value: lai_lv
    # Leaf area index, high vegetation [m**2 m**-2]
  - kind: any
    filters:
    - kind: cf-short-name
      value: lai_hv
    - kind: grib-short-name
      value: lai_hv
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.0001
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 m^2 m^-2 <= lai_[lh]v
  - kind: data-limits
    minimum: 0.0

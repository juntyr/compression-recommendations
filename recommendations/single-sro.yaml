# Requirements for Surface runoff
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Surface runoff [m]
  - kind: any
    filters:
    - kind: cf-short-name
      value: sro
    - kind: grib-short-name
      value: sro
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # The maximum error should be the smaller of either indicated absolute /
  # relative errors (ECMWF)
  # Please communicate with Jasper Denissen (UFZ) / Michel Wortmann (ECMWF)
  # on the issues they solved for runoff (ECMWF)
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 m <= sro
    minimum: 0.0

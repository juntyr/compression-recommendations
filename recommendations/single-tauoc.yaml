# Requirements for Normalized stress into ocean
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Josh Kousal (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Normalized stress into ocean [Numeric]
  - kind: any
    filters:
    - kind: cf-short-name
      value: tauoc
    - kind: grib-short-name
      value: tauoc
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Sara Faghih-Naini (ECMWF) and Josh Kousal (ECMWF): Increased mean absolute
  # bound to 0.01 to permit lossy compression
  #
  # Sara Faghih-Naini (ECMWF) and Josh Kousal (ECMWF): Added max absolute bound
  # to bound error outliers
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 0.02
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 0.01
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

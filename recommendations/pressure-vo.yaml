# Requirements for Vorticity (relative)
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Vorticity (relative) [s**-1]
    filters:
    - kind: cf-standard-name
      value: atmosphere_relative_vorticity
    - kind: cf-short-name
      value: vo
    - kind: grib-short-name
      value: vo
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.05

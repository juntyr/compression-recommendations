# Requirements for Mean sea level pressure
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Mean sea level pressure
    filters:
    - kind: cf-standard-name
      value: air_pressure_at_mean_sea_level
    - kind: cf-short-name
      value: msl
    - kind: grib-short-name
      value: msl
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.207242012 [Pa]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1.0
    - kind: max-pointwise-absolute-error-bound
      value: 1.0

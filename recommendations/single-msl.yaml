# Requirements for Mean sea level pressure
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Mean sea level pressure [Pa]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: air_pressure_at_mean_sea_level
    - kind: cf-short-name
      value: msl
    - kind: grib-short-name
      value: msl
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 1.0
    # global error bounds (all)
  - kind: all
    requirements: []

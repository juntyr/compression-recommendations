# Requirements for Temperature
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Temperature [K]
    filters:
    - kind: cf-standard-name
      value: air_temperature
    - kind: cf-short-name
      value: t
    - kind: grib-short-name
      value: t
- kind: level-kind
  value: pressure
requirements:
- kind: all
  # pointwise error bounds
  #
  # Peter B. (ECMWF) recommended 0.01K for temperature fields for long
  # integrations to make budgets
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to range-relative
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
  - kind: all
    # range-relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-range-relative-error-bound
      value: 0.01

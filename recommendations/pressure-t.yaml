# Requirements for Temperature
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Temperature [K]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: air_temperature
    - kind: cf-short-name
      value: t
    - kind: grib-short-name
      value: t
  # pressure-level variable
- kind: level-kind
  value: pressure

requirements:

  # error bounds (all)
  #
  # Peter Bechtold (ECMWF) recommended 0.01K for temperature fields for long
  # integrations to make budgets
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to pointwise range-
  # relative, since temperature offset in Kelvin is larger than its range
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (all - FIXME)
  - kind: all
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
      # range-relative error (0.01 = 1%)
    - kind: max-pointwise-range-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

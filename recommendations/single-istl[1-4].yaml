# Requirements for Ice temperature layers 1-4
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Ice temperature layer 1 [K]
    filters:
    - kind: cf-short-name
      value: istl1
    - kind: grib-short-name
      value: istl1
  - kind: any
    # Ice temperature layer 2 [K]
    filters:
    - kind: cf-short-name
      value: istl2
    - kind: grib-short-name
      value: istl2
  - kind: any
    # Ice temperature layer 3 [K]
    filters:
    - kind: cf-short-name
      value: istl3
    - kind: grib-short-name
      value: istl3
  - kind: any
    # Ice temperature layer 4 [K]
    filters:
    - kind: cf-short-name
      value: istl4
    - kind: grib-short-name
      value: istl4
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  # 
  # Peter B. (ECMWF) recommended 0.01K for temperature fields for long
  # integrations to make budgets
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to range-relative
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
    - kind: mean-absolute-error-bound
      value: 0.002
  - kind: all
    # range-relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.01

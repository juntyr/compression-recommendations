# Requirements for Time-mean top net short-wave radiation flux
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean top net short-wave radiation flux
    filters:
    - kind: cf-short-name
      value: avg_tnswrf
    - kind: grib-short-name
      value: avg_tnswrf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.02009725571 [W m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.1

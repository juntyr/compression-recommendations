# Requirements for Time-integrated boundary layer dissipation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-integrated boundary layer dissipation [J m**-2]
    filters:
    - kind: cf-standard-name
      value: kinetic_energy_dissipation_in_atmosphere_boundary_layer
    - kind: cf-short-name
      value: bld
    - kind: grib-short-name
      value: bld
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1000.0

# Requirements for Total column vertically-integrated water vapour
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Total column vertically-integrated water vapour
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_atmosphere_mass_content_of_water_vapor
    - kind: cf-short-name
      value: tcwv
    - kind: grib-short-name
      value: tcwv
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.001358293695 [kg m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.1

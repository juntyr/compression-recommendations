# Requirements for Surface short-wave (solar) radiation downwards
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Surface short-wave (solar) radiation downwards
    filters:
    - kind: cf-standard-name
      value: surface_downwelling_shortwave_flux_in_air
    - kind: cf-short-name
      value: ssrd
    - kind: grib-short-name
      value: ssrd
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 210.6914063 [J m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 3600.0
- kind: all
  requirements:
  # valid value range: 0 J m^-2 <= ssrd
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

# Requirements for Evaporation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Evaporation [m of water equivalent]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_water_evaporation_amount
    - kind: cf-short-name
      value: e
    - kind: grib-short-name
      value: e
  # single-level variable
- kind: level-kind
  value: single

requirements:

- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

# Requirements for Time-mean northward gravity wave surface stress
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean northward gravity wave surface stress
    filters:
    - kind: cf-short-name
      value: avg_ingwss
    - kind: grib-short-name
      value: avg_ingwss
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.000377241231 [N m**-2]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.01

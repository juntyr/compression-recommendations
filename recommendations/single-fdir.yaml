# Requirements for Surface direct short-wave (solar) radiation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Surface direct short-wave (solar) radiation [J m**-2]
    filters:
    - kind: cf-short-name
      value: fdir
    - kind: grib-short-name
      value: fdir
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  # 
  # Robin Hogan (ECMWF): See uvb for reasoning on 3600 J/m2
  #
  # Contact people:
  # - Robin Hogan (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 2^(-16) = 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 3600.0
- kind: all
  requirements:
  # valid value range: 0 J m^-2 <= fdir
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

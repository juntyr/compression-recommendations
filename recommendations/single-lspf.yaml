# Requirements for Large-scale precipitation fraction
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Large-scale precipitation fraction [s]
  - kind: any
    filters:
    - kind: cf-short-name
      value: lspf
    - kind: grib-short-name
      value: lspf
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    requirements:
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 s <= lspf
  - kind: data-limits
    minimum: 0.0

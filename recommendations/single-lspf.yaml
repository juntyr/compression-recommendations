# Requirements for Large-scale precipitation fraction
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Large-scale precipitation fraction [s]
    filters:
    - kind: cf-short-name
      value: lspf
    - kind: grib-short-name
      value: lspf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 s <= lspf
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

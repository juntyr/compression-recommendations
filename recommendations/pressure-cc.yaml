# Requirements for Fraction of cloud cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Fraction of cloud cover [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: cc
    - kind: grib-short-name
      value: cc
  # pressure-level variable
- kind: level-kind
  value: pressure

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Richard Forbes (ECMWF)
  # - Robin Hogan (ECMWF)
  #
  # In ERA5, GRIB linear packing with 8 bits adds a maximum pointwise
  # range-relative error of 1 / (2^8 - 1) ⪆ 3.921e-03 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 % <= cc <= 100 %
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

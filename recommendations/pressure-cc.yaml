# Requirements for Fraction of cloud cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Fraction of cloud cover [dimensionless]
    filters:
    - kind: cf-short-name
      value: cc
    - kind: grib-short-name
      value: cc
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # provided by Richard Forbes (ECMWF)
  #
  # Peter Dueben: changed from pointwise-relative to range-relative
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 0.00390625 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-range-relative-error-bound
      value: 0.01
- kind: all
  # valid value range: 0 % <= cc <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

# Requirements for Vertical velocity
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Vertical velocity [Pa s**-1]
    filters:
    - kind: cf-standard-name
      value: lagrangian_tendency_of_air_pressure
    - kind: cf-short-name
      value: w
    - kind: grib-short-name
      value: w
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.05

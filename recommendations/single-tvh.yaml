# Requirements for Type of high vegetation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Type of high vegetation [Code table 4.234]
    filters:
    - kind: cf-short-name
      value: tvh
    - kind: grib-short-name
      value: tvh
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
    # conservative, provided by @juntyr
  - kind: lossless
- kind: all
  # valid value range: 1 <= tvh <= 20
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0
    maximum: 20

# Requirements for Significant wave height of second swell partition
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Significant wave height of second swell partition
    filters:
    - kind: cf-short-name
      value: swh2
    - kind: grib-short-name
      value: swh2
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 9.52e-05 [m]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.01
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.01

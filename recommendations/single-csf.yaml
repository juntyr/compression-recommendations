# Requirements for Convective snowfall
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Convective snowfall
    filters:
    - kind: cf-short-name
      value: csf
    - kind: grib-short-name
      value: csf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 1.419393811e-07 [m of water equivalent]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
- kind: all
  requirements:
  # valid value range: 0 m <= csf
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

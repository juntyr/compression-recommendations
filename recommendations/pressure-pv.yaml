# Requirements for Potential vorticity
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Potential vorticity [K m**2 kg**-1 s**-1]
    filters:
    - kind: cf-short-name
      value: pv
    - kind: grib-short-name
      value: pv
- kind: level-kind
  value: pressure
requirements:
- kind: all
  # pointwise error bounds
  #
  # 0.1 PVU = 1e-7
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
  requirements:
  - kind: any
    # max absolute OR max relative error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 1e-07
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.1

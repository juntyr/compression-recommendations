# Requirements for Mean wave period of third swell partition
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Mean wave period of third swell partition
    filters:
    - kind: cf-short-name
      value: mwp3
    - kind: grib-short-name
      value: mwp3
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0004419907928 [s]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 s <= mwp3
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

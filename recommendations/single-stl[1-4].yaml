# Requirements for Soil temperature levels 1-4
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Soil temperature level 1 [K]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: surface_temperature
    - kind: cf-short-name
      value: stl1
    - kind: grib-short-name
      value: stl1
    # Soil temperature level 2 [K]
  - kind: any
    filters:
    - kind: cf-short-name
      value: stl2
    - kind: grib-short-name
      value: stl2
    # Soil temperature level 3 [K]
  - kind: any
    filters:
    - kind: cf-short-name
      value: stl3
    - kind: grib-short-name
      value: stl3
    # Soil temperature level 4 [K]
  - kind: any
    filters:
    - kind: cf-short-name
      value: stl4
    - kind: grib-short-name
      value: stl4
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # pointwise error bounds
  # 
  # Peter B. (ECMWF) recommended 0.01K for temperature fields for long
  # integrations to make budgets
  #
  # Peter Dueben (ECMWF): changed from pointwise-relative to range-relative
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
    - kind: mean-absolute-error-bound
      value: 0.002
  - kind: all
    # range-relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.01

# Requirements for Convective precipitation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Convective precipitation [m]
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_convective_precipitation_amount
    - kind: cf-short-name
      value: cp
    - kind: grib-short-name
      value: cp
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
- kind: all
  requirements:
  # valid value range: 0 m <= cp
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

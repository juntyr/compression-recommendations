# Requirements for Convective precipitation
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Convective precipitation [m]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_convective_precipitation_amount
    - kind: cf-short-name
      value: cp
    - kind: grib-short-name
      value: cp
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Contact people:
  # - Peter Bechtold (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 m <= cp
  - kind: data-limits
    minimum: 0.0

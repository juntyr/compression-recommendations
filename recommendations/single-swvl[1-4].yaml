# Requirements for Volumetric soil water layers 1-4
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Volumetric soil water layer 1 [m**3 m**-3]
  - kind: any
    filters:
    - kind: cf-short-name
      value: swvl1
    - kind: grib-short-name
      value: swvl1
    # Volumetric soil water layer 2 [m**3 m**-3]
  - kind: any
    filters:
    - kind: cf-short-name
      value: swvl2
    - kind: grib-short-name
      value: swvl2
    # Volumetric soil water layer 3 [m**3 m**-3]
  - kind: any
    filters:
    - kind: cf-short-name
      value: swvl3
    - kind: grib-short-name
      value: swvl3
    # Volumetric soil water layer 4 [m**3 m**-3]
  - kind: any
    filters:
    - kind: cf-short-name
      value: swvl4
    - kind: grib-short-name
      value: swvl4
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Christoph Ruediger (ECMWF) is a bit concerned that these bounded variables
  # can have negative values in ERA5
  #
  # Contact people:
  # - Christoph Ruediger (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-05
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

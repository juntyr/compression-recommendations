# Requirements for Snow albedo
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Snow albedo [dimensionless]
    filters:
    - kind: cf-short-name
      value: asn
    - kind: grib-short-name
      value: asn
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # Ask Gabriele Arduini (ECMWF)
  #
  # Peter Dueben: changed from pointwise-relative to range-relative
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.001
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-range-relative-error-bound
      value: 0.001

# Requirements for Snow albedo
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Snow albedo
    filters:
    - kind: cf-short-name
      value: asn
    - kind: grib-short-name
      value: asn
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # Ask Gabriele Arduini (ECMWF)
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 5.493286153e-06 [dimensionless]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.001
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.001

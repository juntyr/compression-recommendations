# Requirements for Convective snowfall rate water equivalent
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Convective snowfall rate water equivalent
    filters:
    - kind: cf-short-name
      value: csfr
    - kind: grib-short-name
      value: csfr
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 1.403896022e-08 [kg m**-2 s**-1]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.01

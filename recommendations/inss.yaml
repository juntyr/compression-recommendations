# Requirements for Instantaneous northward turbulent surface stress
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Instantaneous northward turbulent surface stress
    filters:
    - kind: cf-short-name
      value: inss
    - kind: grib-short-name
      value: inss
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0002717504103 [N m**-2]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.01

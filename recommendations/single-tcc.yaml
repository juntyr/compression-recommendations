# Requirements for Total cloud cover
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Total cloud cover
    filters:
    - kind: cf-standard-name
      value: cloud_area_fraction
    - kind: cf-short-name
      value: tcc
    - kind: grib-short-name
      value: tcc
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 1.525878906e-05 [dimensionless]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  # valid value range: 0 % <= tcc <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

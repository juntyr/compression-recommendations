# Requirements for Geometric height of 0 degrees C atmospheric isothermal level above ground
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Geometric height of 0 degrees C atmospheric isothermal level above ground [m]
    filters:
    - kind: cf-short-name
      value: deg0l
    - kind: grib-short-name
      value: deg0l
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1.0
- kind: all
  requirements:
  # valid value range: 0 m <= deg0l
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

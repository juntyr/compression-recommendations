# Requirements for Wave spectral peakedness
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Wave spectral peakedness
    filters:
    - kind: cf-short-name
      value: wsp
    - kind: grib-short-name
      value: wsp
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.0006535853609 [dimensionless]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 0.01
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.01

# Requirements for Time-mean large-scale precipitation fraction
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean large-scale precipitation fraction [Proportion]
    filters:
    - kind: cf-short-name
      value: avg_ilspf
    - kind: grib-short-name
      value: avg_ilspf
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
- kind: all
  # valid value range: 0 % <= avg_ilspf <= 100 %
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0
    maximum: 1.0

# Requirements for Geopotential
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Geopotential [m**2 s**-2]
    filters:
    - kind: cf-standard-name
      value: geopotential
    - kind: cf-short-name
      value: z
    - kind: grib-short-name
      value: z
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  # 
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 2^(-24) = 5.960464477539063e-08 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: max-pointwise-absolute-error-bound
      value: 10.0

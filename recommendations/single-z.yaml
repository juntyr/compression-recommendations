# Requirements for Geopotential
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Geopotential [m**2 s**-2]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: geopotential
    - kind: cf-short-name
      value: z
    - kind: grib-short-name
      value: z
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  # 
  # In ERA5, GRIB linear packing with 24 bits adds a maximum pointwise
  # range-relative error of 1 / (2^24 - 1) ⪆ 5.960e-08 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 10.0
    # global error bounds (all)
  - kind: all
    requirements: []

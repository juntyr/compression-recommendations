# Requirements for Sub-surface runoff
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Sub-surface runoff [m]
    filters:
    - kind: cf-short-name
      value: ssro
    - kind: grib-short-name
      value: ssro
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # The maximum error should be the smaller of either indicated absolute /
  # relative errors (ECMWF)
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 1.52587890625e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 1e-05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
- kind: all
  requirements:
  # valid value range: 0 m <= ssro
  #
  # provided by @juntyr
  - kind: data-limits
    minimum: 0.0

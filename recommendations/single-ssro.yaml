# Requirements for Sub-surface runoff
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Christoph Ruediger (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Sub-surface runoff [m]
  - kind: any
    filters:
    - kind: cf-short-name
      value: ssro
    - kind: grib-short-name
      value: ssro
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # The maximum error should be the smaller of either indicated absolute /
  # relative errors (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-05
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Provided by @juntyr
- kind: all
  requirements:
    # 0 m <= ssro
  - kind: data-limits
    minimum: 0.0

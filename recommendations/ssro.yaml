# Requirements for Sub-surface runoff
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Sub-surface runoff
    filters:
    - kind: cf-short-name
      value: ssro
    - kind: grib-short-name
      value: ssro
requirements:
- kind: any
  # pointwise error bounds
  #
  # The maximum error should be the smaller of either indicated absolute/relative
  # errors
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 4.098037607e-07 [m]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 1e-05
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-pointwise-relative-error-bound
      value: 0.01

# Requirements for Minimum temperature at 2 metres since previous post-processing
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Minimum temperature at 2 metres since previous post-processing [K]
  - kind: any
    filters:
    - kind: cf-short-name
      value: mn2t
    - kind: grib-short-name
      value: mn2t
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  # 
  # Peter B. (ECMWF) recommended 0.01K for temperature fields for long
  # integrations to make budgets
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements: []

# Requirements for Time-integrated eastward/northward turbulent surface stress
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)
# - Annelize van Niekerk (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Time-integrated eastward turbulent surface stress [N m**-2 s]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: surface_downward_eastward_stress
    - kind: cf-short-name
      value: ewss
    - kind: grib-short-name
      value: ewss
    # Time-integrated northward turbulent surface stress [N m**-2 s]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: surface_downward_northward_stress
    - kind: cf-short-name
      value: nsss
    - kind: grib-short-name
      value: nsss
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Sara Faghih-Naini (ECMWF) and Annelize van Niekerk (ECMWF): Tightened mean
  # absolute bound, and added a combined max absolute and 1% max relative bound
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 25.0
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.01
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 10.0

# Requirements for Time-mean large-scale precipitation rate
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Peter Bechtold (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Time-mean large-scale precipitation rate [kg m**-2 s**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: avg_lsprate
    - kind: grib-short-name
      value: avg_lsprate
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.01

  # value validity constraints (all)
  #
  # Juniper Tyree (UH): Initialised based on ERA5 data limits
- kind: all
  requirements:
    # 0 kg m^-2 s^-1 <= avg_lsprate
  - kind: data-limits
    minimum: 0.0

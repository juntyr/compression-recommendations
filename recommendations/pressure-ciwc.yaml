# Requirements for Specific cloud ice water content
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Specific cloud ice water content [kg kg**-1]
    filters:
    - kind: cf-short-name
      value: ciwc
    - kind: grib-short-name
      value: ciwc
- kind: level-kind
  value: pressure
requirements:
- kind: any
  # pointwise error bounds
  #
  # In ERA5 GRIB linear packing adds a maximum pointwise
  # range-relative error of 0.000244140625 (0.01 = 1%)
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: max-pointwise-relative-error-bound
      value: 0.01
- kind: all
  # value value range: 0 % <= ciwc
  #
  # provided by @juntyr
  requirements:
  - kind: data-limits
    minimum: 0.0

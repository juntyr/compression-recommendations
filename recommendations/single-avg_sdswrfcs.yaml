# Requirements for Time-mean surface downward short-wave radiation flux, clear sky
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Time-mean surface downward short-wave radiation flux, clear sky
    filters:
    - kind: cf-short-name
      value: avg_sdswrfcs
    - kind: grib-short-name
      value: avg_sdswrfcs
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.01925182343 [W m**-2]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.1

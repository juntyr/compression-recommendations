# Requirements for Benjamin-Feir index
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Benjamin-Feir index [dimensionless]
  - kind: any
    filters:
    - kind: cf-short-name
      value: bfi
    - kind: grib-short-name
      value: bfi
- kind: level-kind
  value: single
requirements:
- kind: all
  # pointwise error bounds
  #
  # Contact people:
  # - Josh Kousal (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-absolute-error-bound
      value: 0.01
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

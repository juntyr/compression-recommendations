# Requirements for Geometric height of 0 degrees C atmospheric isothermal level above ground
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Geometric height of 0 degrees C atmospheric isothermal level above ground
    filters:
    - kind: cf-short-name
      value: deg0l
    - kind: grib-short-name
      value: deg0l
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 0.1040019989 [m]
  requirements:
  - kind: all
    # absolute error
    requirements:
    - kind: mean-pointwise-absolute-error-bound
      value: 1.0

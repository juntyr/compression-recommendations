# Requirements for 10 metre U/V wind components
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Nils Wedi (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # 10 metre U wind component [m s**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: u10
    - kind: grib-short-name
      value: 10u
    # 10 metre V wind component [m s**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: v10
    - kind: grib-short-name
      value: 10v
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  # 
  # Peter Bechtold (ECMWF) and Jean (ECMWF) suggested to go lower than 0.5m/s,
  # e.g. 0.01m/s or even 0.001m/s for wind fields
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  # - kind: any
  #   requirements: []
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 0.001
      # relative error (0.01 = 1%)
    - kind: mean-relative-error-bound
      value: 0.5

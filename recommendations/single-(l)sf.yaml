# Requirements for (Large-scale) snowfall
#
# Please feel free to add comments (with your name),
# and make well-justified changes!
#
# Contact people:
# - Peter Bechtold (ECMWF)

filters:
  # variables (any)
- kind: any
  filters:
    # Snowfall [m of water equivalent]
  - kind: any
    filters:
    - kind: cf-standard-name
      value: lwe_thickness_of_snowfall_amount
    - kind: cf-short-name
      value: sf
    - kind: grib-short-name
      value: sf
    # Large-scale snowfall [m of water equivalent]
  - kind: any
    filters:
    - kind: cf-short-name
      value: lsf
    - kind: grib-short-name
      value: lsf
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # error bounds (all)
  #
  # Sara Faghih-Naini (ECMWF) and Juniper Tyree (UH): Added a maximum pointwise
  # absolute error bound, since a mean error bound for a majority-zero field
  # can lose structure
  #
  # Sara Faghih-Naini (ECMWF): Tightened the maximum absolute bound to 3x the
  # mean absolute bound
  #
  # Sara Faghih-Naini (ECMWF): Tightened the maximum pointwise error to 1x the
  # mean absolute OR 5% pointwise relative
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
    # pointwise error bounds (any)
  - kind: any
    requirements:
      # absolute error
    - kind: max-pointwise-absolute-error-bound
      value: 1e-05
      # relative error (0.01 = 1%)
    - kind: max-pointwise-relative-error-bound
      value: 0.05
    # global error bounds (all)
  - kind: all
    requirements:
      # absolute error
    - kind: mean-absolute-error-bound
      value: 1e-05

  # isovalues (all)
  #
  # Sara Faghih-Naini (ECMWF): Preserve snowfall vs no snowfall
- kind: all
  requirements:
    # no = 0.0 < snowfall
  - kind: isovalue
    value: 0.0

  # value validity constraints (all)
  #
  # Juniper Tyree (UH): Initialised based on ERA5 data limits
- kind: all
  requirements:
    # 0 m <= (l)sf
  - kind: data-limits
    minimum: 0.0

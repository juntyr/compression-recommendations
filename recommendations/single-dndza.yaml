# Requirements for Mean vertical gradient of refractivity inside trapping layer
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
- kind: any
  # variables
  filters:
  - kind: any
    # Mean vertical gradient of refractivity inside trapping layer
    filters:
    - kind: cf-short-name
      value: dndza
    - kind: grib-short-name
      value: dndza
- kind: level-kind
  value: single
requirements:
- kind: any
  # pointwise error bounds
  #
  # GRIB adds in ERA5 a maximum pointwise absolute error of
  # 5.256291479e-05 [m**-1]
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01

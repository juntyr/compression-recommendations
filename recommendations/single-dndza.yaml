# Requirements for Mean vertical gradient of refractivity inside trapping layer
#
# Initialised by @juntyr and @SF-N.
#
# Please feel free to add comments (with your name),
# and make well-justified changes!

filters:
  # variables (any)
- kind: any
  filters:
    # Mean vertical gradient of refractivity inside trapping layer [m**-1]
  - kind: any
    filters:
    - kind: cf-short-name
      value: dndza
    - kind: grib-short-name
      value: dndza
  # single-level variable
- kind: level-kind
  value: single

requirements:

  # pointwise error bounds
  #
  # Contact people:
  # - Nils Wedi (ECMWF)
  #
  # In ERA5, GRIB linear packing with 16 bits adds a maximum pointwise
  # range-relative error of 1 / (2^16 - 1) ⪆ 1.525e-05 (0.01 = 1%)
- kind: all
  requirements:
  - kind: all
    # relative error (0.01 = 1%)
    requirements:
    - kind: mean-relative-error-bound
      value: 0.01
